- name: "[Ctrl-F: Force as an Interface for Humanoid Loco-Manipulation](https://forcectrl.github.io/)"
  video: ctrl_f_v5.mp4
  authors: "<strong>Mengjie Zhao</strong><sup>*</sup>, <a href='https://thomaschen98.github.io/'>Yuxin Chen</a><sup>*</sup>, <a href='https://yiyangshao2003.github.io/'>Yiyang Shao</a>, <a href='https://chuye03.github.io/'>Chuye Hong</a>, <a href='https://github.com/JaydenChenjk'>Jiakang Chen</a>, <a href='https://hybrid-robotics.berkeley.edu/koushil/'>Koushil Sreenath</a>, <a href='https://me.berkeley.edu/people/masayoshi-tomizuka/'>Masayoshi Tomizuka</a>"
  authors_note: "<sup>*</sup> Equal contribution"
  venue: "Under review at ICRA 2027. IROS 2026 S2RCC Workshop."
  arxiv: https://arxiv.org/abs/2611.05507
  webpage: https://forcectrl.github.io/
  info: "Ctrl-F proposes contact force as the interface between high-level planning and whole-body control, so that one controller can handle many objects and interaction types, and a learned planner can adapt the force online."

- name: "SONAR: Can We Tune Humanoid Behavior Foundation Models for Dynamic and Contact-Rich Tasks?"
  video: sonar_v2.mp4
  authors: "<strong>Mengjie Zhao</strong><sup>*</sup>, <a href='https://thomaschen98.github.io/'>Yuxin Chen</a><sup>*</sup>, <a href='https://shaotingzhu.github.io/'>Shaoting Zhu</a>, Yu Hong, <a href='https://perkins729.github.io/'>Yunshen Wang</a>, <a href='https://mrmoore98.github.io/liuyicheng/'>Yicheng Liu</a>, <a href='https://scholar.google.com/citations?user=u-ELP2oAAAAJ'>Baijun Ye</a>, <a href='https://scholar.google.com/citations?user=BOYQK4IAAAAJ'>Xiaoyu Tian</a>, <a href='https://buzz-beater.github.io/'>Baoxiong Jia</a>, <a href='https://hangzhaomit.github.io/'>Hang Zhao</a>, <a href='https://siyuanhuang.com/'>Siyuan Huang</a>, <a href='https://me.berkeley.edu/people/masayoshi-tomizuka/'>Masayoshi Tomizuka</a>"
  authors_note: "<sup>*</sup> Equal contribution"
  venue: "RSS 2026 ExWBC Workshop (Oral); RSS 2026 WCBM Workshop. Journal version in preparation."
  info: "SONAR asks whether perception, with an object mask as task semantics, can let a frozen humanoid behavior foundation model correct its motion locally when the reference motion is imperfect."

- name: "[BURGER: Benchmarking and Understanding Robotic Generalization via Embodied dRawing](https://burger-bench.github.io/)"
  video: burger_v5.mp4
  authors: "<a href='https://openreview.net/profile?id=~Xiangyu_Xu10'>Xiangyu Xu</a><sup>*</sup>, <a href='https://openreview.net/profile?id=~Bangshuai_Peng1'>Bangshuai Peng</a><sup>*</sup>, <a href='https://taichi-pink.github.io/Ziyi-Liu/'>Ziyi Liu</a><sup>*</sup>, <strong>Mengjie Zhao</strong><sup>*</sup>, <a href='https://ctp314.github.io/'>Chenhao Lu</a>, Zhengyang Fan, <a href='https://iiis.tsinghua.edu.cn/en/People/Faculty/XuHuazhe.htm'>Huazhe Xu</a>, <a href='https://hukz18.github.io/'>Kaizhe Hu</a>"
  authors_note: "<sup>*</sup> Equal contribution"
