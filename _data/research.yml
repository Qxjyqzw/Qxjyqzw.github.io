  arxiv: https://arxiv.org/abs/2610.40532
  webpage: https://burger-bench.github.io/
  code: https://github.com/Qxjyqzw/BURGER
  info: "BURGER proposes embodied drawing as a benchmark for robotic generalization: drawing tasks carry rich semantic and spatial structure, scale in difficulty, and are scored automatically, which makes generalization measurable."

